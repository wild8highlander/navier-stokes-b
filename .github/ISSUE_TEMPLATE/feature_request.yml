name: ✨ Feature request
description: Suggest an improvement or a new verification layer.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is missing or inconvenient today?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of improvement
      options:
        - New verification language / port
        - New physics run (P8+)
        - Performance / reproducibility
        - Documentation (README, site, papers)
        - CI / build system
        - other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, concretely?
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: License acknowledgment
      description: >
        This repository is proprietary (IPL-RP-1.0). By submitting you confirm that
        your contribution is offered to the copyright holder under the same license
        and that you agree with CONTRIBUTING.md.
      options:
        - label: I have read CONTRIBUTING.md and agree to the IPL-RP-1.0 contribution terms
          required: true
