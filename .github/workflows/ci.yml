name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (legacy research code excluded via pyproject)
        run: ruff check . --output-format=concise

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific stack
        run: pip install numpy scipy matplotlib mpmath pytest
      - name: Run pytest (heavy toolchains auto-skip when absent)
        run: python -m pytest verification/tests/ -v --tb=short

  verification-smoke:
    name: Verification smoke (all suites, quick preset)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install numpy and mpmath (the L-chain and the constants suite need them)
        run: pip install numpy mpmath
      - name: Run the aggregate runner (levels L1-L4 + monolith pinned task + exact constants + Lean audit)
        run: python verification/common/python/main.py --all

  verification-monolith:
    name: Verification monolith (verify_ns_full.py, CI preset)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The monolith is stdlib-only by contract: no pip install at all.
      - name: Run the full CI preset (tasks 1-15, two-pass, ~2 min)
        run: python verification/verify_ns_full.py --ci

  verification-tree-audit:
    name: Verification tree audit (5 evidence groups)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install numpy and mpmath (group D re-runs the L-chain live)
        run: pip install numpy mpmath
      - name: Run the whole-tree auditor (structure, trust base, Lean core, L1-L4, Makefile hygiene)
        run: python verification/tools/audit/verify_repo.py

  lab-smoke:
    name: Research lab smoke (N=16)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install numpy and pytest
        run: pip install numpy pytest
      - name: Run all four lab experiments (smoke preset, EN + RU output)
        run: |
          python -m research_lab.run_lab --experiment taylor_green --preset smoke
          python -m research_lab.run_lab --experiment abc_blowup_hunt --preset smoke
          python -m research_lab.run_lab --experiment hou_luo_tubes --preset smoke
          NSB_LAB_LANG=ru python -m research_lab.run_lab --experiment bcorrection_stress --preset smoke
      - name: Lab unit tests
        run: python -m pytest research_lab/tests -q

  docs-hygiene:
    name: Docs hygiene (README gates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Every directory has a README; primary READMEs are English-only
        run: python .github/scripts/check_readmes.py

  manifest-integrity:
    name: Manifest integrity (sha256)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify every file against MANIFEST.json
        run: python .github/scripts/verify_manifest.py
