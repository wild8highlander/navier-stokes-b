name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (advisory on legacy research code)
        run: ruff check . --output-format=concise
        continue-on-error: true

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific stack
        run: pip install numpy scipy matplotlib mpmath pytest
      - name: Run pytest (heavy toolchains auto-skip when absent)
        run: python -m pytest verification/tests/ -v --tb=short

  verification-smoke:
    name: Verification smoke (Python, section 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific stack
        run: pip install numpy scipy matplotlib mpmath
      - name: Run section 1 (correction b) Python verification
        run: python verification/common/python/main.py --section 1 --preset default

  manifest-integrity:
    name: Manifest integrity (sha256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every file against MANIFEST.json
        run: python .github/scripts/verify_manifest.py
