name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (legacy research code excluded via pyproject)
        run: ruff check . --output-format=concise

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific stack
        run: pip install numpy scipy matplotlib mpmath pytest
      - name: Run pytest (heavy toolchains auto-skip when absent)
        run: python -m pytest verification/tests/ -v --tb=short

  verification-smoke:
    name: Verification smoke (Python, section 1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scientific stack
        run: pip install numpy scipy matplotlib mpmath
      - name: Run section 1 (correction b) Python verification
        run: python verification/common/python/main.py --section 1 --preset default

  lab-smoke:
    name: Research lab smoke (N=16)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install numpy
      - name: Run all four lab experiments (smoke preset, EN + RU output)
        run: |
          python -m research_lab.run_lab --experiment taylor_green --preset smoke
          python -m research_lab.run_lab --experiment abc_blowup_hunt --preset smoke
          python -m research_lab.run_lab --experiment hou_luo_tubes --preset smoke
          NSB_LAB_LANG=ru python -m research_lab.run_lab --experiment bcorrection_stress --preset smoke
      - name: Lab unit tests
        run: python -m pytest research_lab/tests -q

  manifest-integrity:
    name: Manifest integrity (sha256)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every file against MANIFEST.json
        run: python .github/scripts/verify_manifest.py
