[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-papers"
description = "Multi-language computational verification of NSE regularity, AB-Cloud spectral theory, KdV integrability, and Riemann Hypothesis"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "Isaev Iskhak Khamzatovich", email = "aslan08_05@mail.ru"}
]
keywords = ["navier-stokes", "riemann-hypothesis", "lean4", "formal-verification", "KdV", "spectral-theory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Programming Language :: C++",
    "Programming Language :: Haskell",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "black>=23.0", "pre-commit>=3.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
gpu = ["cupy-cuda12x>=13.0", "jax>=0.4"]

[project.urls]
Homepage = "https://github.com/wild8highlander/research-papers"
Documentation = "https://wild8highlander.github.io/research-papers"
Repository = "https://github.com/wild8highlander/research-papers"
Issues = "https://github.com/wild8highlander/research-papers/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["verification/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
