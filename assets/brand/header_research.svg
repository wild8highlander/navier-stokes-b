<style>
.flow  { animation: dashflow var(--fd,7s) linear infinite; }
.flowr { animation: dashflowr var(--fd,7s) linear infinite; }
.comet { animation: comet var(--fd,6s) linear infinite; }
.spin  { animation: spin360 var(--fd,26s) linear infinite; transform-box: fill-box; transform-origin: center; }
.spinr { animation: spinrev var(--fd,26s) linear infinite; transform-box: fill-box; transform-origin: center; }
.pulse { animation: pulseop var(--fd,3.2s) ease-in-out infinite; }
.breathe { animation: breathe var(--fd,4.2s) ease-in-out infinite; }
.glow  { animation: glowpulse var(--fd,3.6s) ease-in-out infinite; }
