<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="224" viewBox="0 0 1280 224" role="img" aria-label="navier-stokes-b — L1 to L5 verification chain with a travelling verification pulse">
<defs>
  <linearGradient id="lvBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#0A0E1A"/><stop offset="1" stop-color="#0B1226"/>
  </linearGradient>
  <linearGradient id="lvWord" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <radialGradient id="lvGlowA" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#F59E0B" stop-opacity=".4"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
  </radialGradient>
  <pattern id="lvGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#16233F" stroke-width="1"/>
  </pattern>
  <filter id="lvSoft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .node { animation: lvNode 10s linear infinite; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: 2s; }
    .n3 { animation-delay: 4s; }  .n4 { animation-delay: 6s; }
    .n5 { animation-delay: 8s; }
    @keyframes lvNode {
      0%,2% { stroke: #1F3A5F; fill: #11203A; }
      8%,18% { stroke: #00E5FF; fill: #0E2A4A; }
      26%,100% { stroke: #1F3A5F; fill: #11203A; }
    }
    .tag { animation: lvTag 10s linear infinite; }
    @keyframes lvTag {
      0%,2% { opacity: .45; } 8%,18% { opacity: 1; } 26%,100% { opacity: .45; }
    }
    .pulse { animation: lvPulse 10s linear infinite; }
    @keyframes lvPulse {
      0%   { transform: translateX(0px);   opacity: 0; }
      3%   { opacity: 1; }
      20%  { transform: translateX(216px); opacity: 1; }
      23%  { opacity: 0; }
      28%  { transform: translateX(216px); opacity: 0; }
      31%  { opacity: 1; }
      46%  { transform: translateX(432px); opacity: 1; }
      49%  { opacity: 0; }
      54%  { transform: translateX(432px); opacity: 0; }
      57%  { opacity: 1; }
      72%  { transform: translateX(648px); opacity: 1; }
      75%  { opacity: 0; }
      80%  { transform: translateX(648px); opacity: 0; }
      83%  { opacity: 1; }
      96%  { transform: translateX(864px); opacity: 1; }
      99%  { opacity: 0; }
      100% { transform: translateX(864px); opacity: 0; }
    }
  </style>
</defs>

<rect width="1280" height="224" fill="url(#lvBg)"/>
<rect width="1280" height="224" fill="url(#lvGrid)" opacity=".5"/>
<circle cx="640" cy="112" r="190" fill="url(#lvGlowA)" opacity=".6"/>

<text x="64" y="58" class="mono" font-size="30" font-weight="700" fill="url(#lvWord)">the L1&#8211;L5 reference chain</text>
<text x="64" y="86" class="mono" font-size="14" fill="#8B949E">scripts/python_levels &#183; every level a standalone verifier &#183; L5 = 3D Taylor&#8211;Green BKM protocol</text>

<!-- connector -->
<rect x="180" y="132" width="864" height="3" fill="#1F3A5F"/>
<g class="pulse">
  <circle cx="180" cy="133.5" r="7" fill="#F59E0B" filter="url(#lvSoft)"/>
  <circle cx="180" cy="133.5" r="4.5" fill="#FBBF24"/>
</g>

<!-- nodes: cx = 180, 396, 612, 828, 1044 -->
<g class="mono" text-anchor="middle" font-size="20" font-weight="700">
  <rect class="node n1" x="148" y="112" width="64" height="43" rx="10" stroke-width="2"/>
  <text x="180" y="140" fill="#E6EDF3">L1</text>
  <rect class="node n2" x="364" y="112" width="64" height="43" rx="10" stroke-width="2"/>
  <text x="396" y="140" fill="#E6EDF3">L2</text>
  <rect class="node n3" x="580" y="112" width="64" height="43" rx="10" stroke-width="2"/>
  <text x="612" y="140" fill="#E6EDF3">L3</text>
  <rect class="node n4" x="796" y="112" width="64" height="43" rx="10" stroke-width="2"/>
  <text x="828" y="140" fill="#E6EDF3">L4</text>
  <rect class="node n5" x="1012" y="112" width="64" height="43" rx="10" stroke-width="2"/>
  <text x="1044" y="140" fill="#E6EDF3">L5</text>
</g>
<g class="mono" text-anchor="middle" font-size="12">
  <text class="tag" x="180"  y="182" fill="#58A6FF">exact constants</text>
  <text class="tag" x="396"  y="182" fill="#58A6FF">rotation algebra</text>
  <text class="tag" x="612"  y="182" fill="#58A6FF">Kirchhoff vortices</text>
  <text class="tag" x="828"  y="182" fill="#58A6FF">2D NSE</text>
  <text class="tag" x="1044" y="182" fill="#58A6FF">3D BKM protocol</text>
  <text x="180"  y="200" fill="#8B949E" font-size="11">mpmath &#183; 50 digits</text>
  <text x="396"  y="200" fill="#8B949E" font-size="11">R&#7488;R = I</text>
  <text x="612"  y="200" fill="#8B949E" font-size="11">RK4 order 4</text>
  <text x="828"  y="200" fill="#8B949E" font-size="11">&#969;&#8242; = cos &#952;b &#183; &#969;</text>
  <text x="1044" y="200" fill="#8B949E" font-size="11">I_BKM pinned</text>
</g>
</svg>
