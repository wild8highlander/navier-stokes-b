<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="224" viewBox="0 0 1280 224" role="img" aria-label="navier-stokes-b — CI: eight gates lighting up in sequence, every verification suite green">
<defs>
  <linearGradient id="ciBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#0A0E1A"/><stop offset="1" stop-color="#0B1226"/>
  </linearGradient>
  <linearGradient id="ciWord" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <radialGradient id="ciGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#3FB950" stop-opacity=".35"/><stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ciGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#16233F" stroke-width="1"/>
  </pattern>
  <filter id="ciSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .job  { animation: ciJob 9.6s linear infinite; }
    .j1 { animation-delay: 0s;   } .j2 { animation-delay: 1.2s; }
    .j3 { animation-delay: 2.4s; } .j4 { animation-delay: 3.6s; }
    .j5 { animation-delay: 4.8s; } .j6 { animation-delay: 6.0s; }
    .j7 { animation-delay: 7.2s; } .j8 { animation-delay: 8.4s; }
    @keyframes ciJob {
      0%,2%   { opacity: .35; }
      6%,92%  { opacity: 1; }
      96%,100%{ opacity: .35; }
    }
    .jobRect { animation: ciRect 9.6s linear infinite; }
    @keyframes ciRect {
      0%,2%   { stroke: #1F3A5F; fill: #11203A; }
      6%,92%  { stroke: #3FB950; fill: #0E2F1D; }
      96%,100%{ stroke: #1F3A5F; fill: #11203A; }
    }
    .cursor { animation: ciBlink 1.05s steps(1) infinite; }
    @keyframes ciBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .verdict { animation: ciPulse 3s ease-in-out infinite; }
    @keyframes ciPulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  </style>
</defs>

<rect width="1280" height="224" fill="url(#ciBg)"/>
<rect width="1280" height="224" fill="url(#ciGrid)" opacity=".5"/>
<circle cx="1140" cy="40" r="120" fill="url(#ciGlow)" filter="url(#ciSoft)"/>
<circle cx="120" cy="200" r="120" fill="url(#ciGlow)" filter="url(#ciSoft)" opacity=".6"/>

<text x="56" y="66" class="mono" font-size="34" font-weight="700" fill="url(#ciWord)">CI on every push</text>
<text x="56" y="94" class="mono" font-size="14" fill="#8B949E">eight gates · deterministic, seeded, idempotent · heavy toolchains auto-skip when absent</text>
<text x="56" y="120" class="mono" font-size="12.5" fill="#58A6FF">green ⇔ tree matches MANIFEST.json and every verification suite passes</text>

<!-- seven job chips, two rows -->
<g class="mono" font-size="12">
  <g class="job j1"><rect class="jobRect" x="56"  y="140" width="160" height="30" rx="8" stroke-width="1.4"/><text x="68"  y="160" fill="#3FB950">1 lint · ruff</text></g>
  <g class="job j2"><rect class="jobRect" x="226" y="140" width="196" height="30" rx="8" stroke-width="1.4"/><text x="238" y="160" fill="#3FB950">2 tests · py3.11+3.12</text></g>
  <g class="job j3"><rect class="jobRect" x="432" y="140" width="216" height="30" rx="8" stroke-width="1.4"/><text x="444" y="160" fill="#3FB950">3 smoke · all suites</text></g>
  <g class="job j4"><rect class="jobRect" x="658" y="140" width="216" height="30" rx="8" stroke-width="1.4"/><text x="670" y="160" fill="#3FB950">4 monolith · tasks 1–15</text></g>
  <g class="job j5"><rect class="jobRect" x="884" y="140" width="216" height="30" rx="8" stroke-width="1.4"/><text x="896" y="160" fill="#3FB950">5 tree audit · 5 groups</text></g>
  <g class="job j6"><rect class="jobRect" x="56"  y="180" width="196" height="30" rx="8" stroke-width="1.4"/><text x="68"  y="200" fill="#3FB950">6 lab smoke · N = 16</text></g>
  <g class="job j7"><rect class="jobRect" x="262" y="180" width="196" height="30" rx="8" stroke-width="1.4"/><text x="274" y="200" fill="#3FB950">7 docs · hygiene</text></g>
  <g class="job j8"><rect class="jobRect" x="468" y="180" width="216" height="30" rx="8" stroke-width="1.4"/><text x="480" y="200" fill="#3FB950">8 manifest · sha256</text></g>
</g>

<g class="verdict">
  <rect x="1000" y="176" width="222" height="38" rx="10" fill="#0E2F1D" stroke="#3FB950" stroke-width="1.6"/>
  <text x="1111" y="200" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#3FB950">8/8 PASS · exit 0</text>
</g>
<rect x="975" y="190" width="9" height="15" fill="#00E5FF" class="cursor"/>
</svg>
