<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="the b-rotation: dial sweeping to theta_b and velocity decomposition">
<defs>

<linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#0A0E1A"/><stop offset="1" stop-color="#0B1226"/>
</linearGradient>
<linearGradient id="cyA" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#A855F7"/>
</linearGradient>
<linearGradient id="cyAm" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#F59E0B"/>
</linearGradient>
<linearGradient id="amG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/>
</linearGradient>
<radialGradient id="glowC" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".5"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#F59E0B" stop-opacity=".45"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowV" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#A855F7" stop-opacity=".4"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
</radialGradient>
<pattern id="bpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#16233F" stroke-width="1"/>
</pattern>
<pattern id="bpGridFine" width="16" height="16" patternUnits="userSpaceOnUse">
  <path d="M16 0H0V16" fill="none" stroke="#16233F" stroke-width=".5" opacity=".6"/>
</pattern>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="soft8" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="8"/>
</filter>
<filter id="soft16" x="-120%" y="-120%" width="340%" height="340%">
  <feGaussianBlur stdDeviation="16"/>
</filter>

</defs>
<style>
.flow  { animation: dashflow var(--fd,7s) linear infinite; }
.flowr { animation: dashflowr var(--fd,7s) linear infinite; }
.comet { animation: comet var(--fd,6s) linear infinite; }
.spin  { animation: spin360 var(--fd,26s) linear infinite; transform-box: fill-box; transform-origin: center; }
.spinr { animation: spinrev var(--fd,26s) linear infinite; transform-box: fill-box; transform-origin: center; }
.pulse { animation: pulseop var(--fd,3.2s) ease-in-out infinite; }
.breathe { animation: breathe var(--fd,4.2s) ease-in-out infinite; }
.glow  { animation: glowpulse var(--fd,3.6s) ease-in-out infinite; }
.floaty{ animation: floaty var(--fd,5.5s) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.driftx{ animation: driftx var(--fd,6s) ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.flicker { animation: flicker var(--fd,2.6s) ease-in-out infinite; }
.blink { animation: blinkop var(--fd,1.8s) steps(2,end) infinite; }
@keyframes dashflow  { to { stroke-dashoffset: -640; } }
@keyframes dashflowr { to { stroke-dashoffset: 640; } }
@keyframes spin360 { to { transform: rotate(360deg); } }
@keyframes spinrev { to { transform: rotate(-360deg); } }
@keyframes pulseop { 0%,100% { opacity: .18; } 50% { opacity: 1; } }
@keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes glowpulse { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes driftx { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
@keyframes flicker { 0%,100% { opacity: .82; } 42% { opacity: .95; } 55% { opacity: .68; } 70% { opacity: .9; } }
@keyframes blinkop { 0%,49% { opacity: 1; } 50%,100% { opacity: .15; } }
@keyframes comet { 0% { stroke-dashoffset: var(--c0,1040); } 100% { stroke-dashoffset: var(--c1,-1000); } }

@keyframes needle { 0% { transform: rotate(0deg);} 55%,82% { transform: rotate(-28.6deg);} 100% { transform: rotate(0deg);} }
</style>
<rect width="1200" height="360" rx="24" fill="url(#bgG)"/>
<g clip-path="none" opacity=".55"><rect width="1200" height="360" rx="24" fill="url(#bpGrid)"/></g>
<g opacity=".28"><rect width="1200" height="360" rx="24" fill="url(#bpGridFine)"/></g>
<rect x="1.5" y="1.5" width="1197" height="357" rx="22.5" fill="none" stroke="#1E2A44" stroke-width="2"/>
<circle cx="360.0" cy="187.20000000000002" r="108" fill="none" stroke="#22D3EE" stroke-width="1.6" opacity=".55"/>
<path d="M 230.0 187.20000000000002 H 490.0" stroke="#1E2A44" stroke-width="1.4"/>
<path d="M 360.0 61.20000000000002 V 313.20000000000005" stroke="#1E2A44" stroke-width="1.4"/>
<path d="M 468.0 187.20000000000002 A 108 108 0 0 0 454.8 135.5" fill="none" stroke="#F59E0B" stroke-width="5" opacity=".9"/>
<circle cx="454.8" cy="135.5" r="6" fill="#FBBF24" class="breathe" style="--fd:3s"/>
<g style="animation:needle 6s ease-in-out infinite; transform-box: view-box; transform-origin: 360.0px 187.20000000000002px"><path d="M 360.0 187.20000000000002 L 468.0 187.20000000000002" stroke="#00E5FF" stroke-width="2.6"/><circle cx="468.0" cy="187.20000000000002" r="5.5" fill="#00E5FF"/></g>
<circle cx="360.0" cy="187.20000000000002" r="40" fill="#00E5FF" opacity="0.18" filter="url(#soft8)" class="glow" style="--fd:Nones"/><text x="394.0" y="173.20000000000002" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="13.5" fill="#FBBF24" text-anchor="start" letter-spacing="2.5" opacity="0.92" font-weight="600" >θ_b ≈ 3.5765°</text><text x="360.0" y="335.20000000000005" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#8CA3C7" text-anchor="middle" letter-spacing="1" opacity="0.92" font-weight="600" >Rodrigues rotation u′ = u∥ + √(1−sin²φ)·u⊥ + sin φ·(ω̂×u⊥)</text><text x="672.0000000000001" y="94.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="13" fill="#E6F1FF" text-anchor="start" letter-spacing="1.5" opacity="0.92" font-weight="600" >decomposition of u</text><text x="672.0000000000001" y="131.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#00E5FF" text-anchor="start" letter-spacing="1" opacity="0.92" font-weight="600" >u∥</text><rect x="736.0000000000001" y="117.0" width="330" height="14" rx="7" fill="#0D1117" stroke="#1E2A44" stroke-width="1"/>
<rect x="736.0000000000001" y="117.0" width="205" height="14" rx="7" fill="#00E5FF" opacity=".8" class="growbar" style="--fd:.9s; animation-delay:0.30s; transform-box: fill-box; transform-origin: left"/>
<text x="672.0000000000001" y="165.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#22D3EE" text-anchor="start" letter-spacing="1" opacity="0.92" font-weight="600" >u⊥</text><rect x="736.0000000000001" y="151.0" width="330" height="14" rx="7" fill="#0D1117" stroke="#1E2A44" stroke-width="1"/>
<rect x="736.0000000000001" y="151.0" width="330" height="14" rx="7" fill="#22D3EE" opacity=".8" class="growbar" style="--fd:.9s; animation-delay:0.65s; transform-box: fill-box; transform-origin: left"/>
<text x="672.0000000000001" y="199.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#A855F7" text-anchor="start" letter-spacing="1" opacity="0.92" font-weight="600" >ω̂×u⊥</text><rect x="736.0000000000001" y="185.0" width="330" height="14" rx="7" fill="#0D1117" stroke="#1E2A44" stroke-width="1"/>
<rect x="736.0000000000001" y="185.0" width="125" height="14" rx="7" fill="#A855F7" opacity=".8" class="growbar" style="--fd:.9s; animation-delay:1.00s; transform-box: fill-box; transform-origin: left"/>
<text x="672.0000000000001" y="234.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#FBBF24" text-anchor="start" letter-spacing="1.2" opacity="0.92" font-weight="600" class="breathe" style="--fd:3.6s">energy injection: exactly 0.00e+00</text><text x="736.0000000000001" y="258.0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="11.5" fill="#8CA3C7" text-anchor="start" letter-spacing=".8" opacity="0.92" font-weight="600" >|ΔE| per rotation ≤ 1.4×10⁻⁹ (float drift only)</text>
</svg>
