<text x="978" y="212" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="12.5" fill="#A855F7" text-anchor="start" letter-spacing="2.5" opacity="0.92" font-weight="600" >k⁻³</text><text x="340" y="256" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="11.5" fill="#22D3EE" text-anchor="start" letter-spacing="1.5" opacity="0.92" font-weight="600" class="breathe" style="--fd:4s">inertial range</text><text x="730" y="256" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="11.5" fill="#8CA3C7" text-anchor="start" letter-spacing="1.5" opacity="0.92" font-weight="600" >dissipative range</text><text x="1140" y="324" font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,Menlo,monospace" font-size="11.5" fill="#8CA3C7" text-anchor="end" letter-spacing="1" opacity="0.92" font-weight="600" >E(k) = C_K · ε^(2/3) · k^(−5/3) · C_K ≈ 1.50</text>
</svg>
